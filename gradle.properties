# Memory for the NeoForm decompile/setup. Daemon off to avoid stale-JDK daemons.

org.gradle.jvmargs=-Xmx4G

org.gradle.daemon=false

# org.gradle.java.home intentionally unset: rely on JAVA_HOME / the foojay toolchain

# resolver so the build works on any machine. Minecraft 1.21.1 requires JDK 21; the

# system JDK here is 17, so the toolchain provisions 21 rather than using JAVA_HOME.



## Minecraft / NeoForge

minecraft_version=1.21.1

minecraft_version_range=[1.21.1,1.21.2)

neoforge_version=21.1.234

neoforge_version_range=[21.1.234,21.2)

loader_version_range=[4,)



# Parchment parameter names. Matches what MCA 1.21.1 itself builds against.

parchment_minecraft=1.21.1

parchment_version=2024.11.17



## Dependencies

# MCA Reborn for 1.21.1 NeoForge, from the official Conczin Maven. EXACT pin, never a

# range: this mod mixes into MCA internals, so the resolved binary is the contract (see

# docs/PORT-1.21.1-EVIDENCE.md for the SHA-256 and every target descriptor).

#

# The loader is in the artifact id (mca-neoforge), so unlike the Modrinth Maven there is

# no Fabric/NeoForge ambiguity to disambiguate with a file id.

#

# Note 7.7.36+1.21.1 was never published; -beta.3 is the real latest. The newest

# non-prerelease is 7.7.33+1.21.1.

mca_version=7.7.36-beta.3+1.21.1

# Runtime range for neoforge.mods.toml. 7.7.13 is the first published 1.21.1 NeoForge MCA; the

# reflective binding degrades gracefully on unknown members, and McaBindingProbeTest replays the

# manifest against every version in mca_probe_versions, so the range is as wide as SOURCE's [7.6,8).

mca_version_range=[7.7.13,8)

# Every MCA build the binding probe test replays the manifest against, comma-separated, each in

# its own class loader. 7.7.33+1.21.1 is the latest non-prerelease 1.21.1 NeoForge build,

# 7.7.36-beta.3+1.21.1 the latest overall. Add a version here whenever MCA moves again.

mca_probe_versions=7.7.33+1.21.1,7.7.36-beta.3+1.21.1

# architectury_version \u2014 DELETED. MCA's 1.21.1 NeoForge artifact does not use Architectury.



## Mod metadata

mod_id=mcaconversations

mod_name=MCA: Conversations AI

# GPL-3.0 to match MCA Reborn, whose internals this mod links against. See the LICENSE file.

mod_license=GPL-3.0-only

# The AI edition's own line. It is based on upstream MCA: Conversations 1.8.0 and numbered above every 1.x
# release, so ranges written against the original ([1.7,) and the like) still accept it as a drop-in.

mod_version=2.0.0-ai.1

mod_group_id=dev.otectus.mcaconversations

mod_authors=Pablo Saura (saurasanchezpablo)

# Shown under the authors in the mods list. The original mod and MCA Reborn are credited here and in NOTICE.md.

mod_credits=Based on MCA: Conversations by otectus (GPL-3.0). Built for Minecraft Comes Alive: Reborn by Luke100000 and Conczin.

mod_display_url=https://modrinth.com/mod/mca-conversations-ai

mod_issue_tracker_url=https://github.com/saurasanchezpablo/MCAConversations-AIsupport/issues

mod_source_url=https://github.com/saurasanchezpablo/MCAConversations-AIsupport

# Modrinth project the Minotaur upload targets (slug or id), and the release channel of this version.

modrinth_project=mca-conversations-ai

modrinth_version_type=beta

# NOTE: non-ASCII must be written as a \uXXXX escape. Gradle reads this file with the Java

# Properties charset (ISO-8859-1), so a literal UTF-8 em-dash here arrives as three mojibake

# chars and is written into neoforge.mods.toml as invalid UTF-8 - which NightConfig refuses to

# parse, and FML then reports as "not a valid mod file".

mod_description=MCA: Conversations with AI villagers. Talk to Minecraft Comes Alive: Reborn villagers in your own words: they answer through an AI model, remember you, do what you ask (work, errands, cooking, building), keep their word, and live their own village life \u2014 festivals, elections, dates, grudges and gossip.


# Exact-match version for the choice payload contracts.
network_protocol=5
